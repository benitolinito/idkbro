name: Build VS Code extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-vscode-extension.yml"
      - "apps/vscode/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "vitest.config.ts"

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          extension_version="$(node -p "require('./apps/vscode/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$extension_version"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package -w multicode-vscode

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: multicode-vscode-${{ github.run_number }}
          path: apps/vscode/multicode-vscode-*.vsix
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packaged VSIX
        uses: actions/download-artifact@v8
        with:
          name: multicode-vscode-${{ github.run_number }}
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*.vsix
          --repo "$GITHUB_REPOSITORY"
          --title "MultiCode $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
          --latest
