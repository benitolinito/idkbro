name: Build VS Code extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-vscode-extension.yml"
      - "apps/vscode/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "vitest.config.ts"

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      extension-version: ${{ steps.extension-version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Read extension version
        id: extension-version
        run: |
          extension_version="$(node -p "require('./apps/vscode/package.json').version")"
          echo "version=$extension_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify build does not change the lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Package extension
        run: npm run package -w multicode-vscode

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: multicode-vscode-${{ github.run_number }}
          path: apps/vscode/multicode-vscode-*.vsix
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packaged VSIX
        uses: actions/download-artifact@v8
        with:
          name: multicode-vscode-${{ github.run_number }}
          path: release

      - name: Check release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION_VERSION: ${{ needs.build.outputs.extension-version }}
        run: |
          release_tag="v$EXTENSION_VERSION"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" release/*.vsix
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "MultiCode $RELEASE_TAG"
          --generate-notes
          --latest
