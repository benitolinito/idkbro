name: multicode-relay

services:
  postgres:
    container_name: multicode-postgres
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MULTICODE_POSTGRES_DB:-multicode}
      POSTGRES_USER: ${MULTICODE_POSTGRES_USER:?set MULTICODE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MULTICODE_POSTGRES_PASSWORD:?set MULTICODE_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      TZ: ${TZ:-America/New_York}
    volumes:
      - multicode-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  relay:
    container_name: multicode-relay
    image: multicode-relay:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:7337:7337"
    environment:
      MULTICODE_RELAY_HOST: 0.0.0.0
      MULTICODE_RELAY_PORT: 7337
      MULTICODE_MAX_ROOMS: ${MULTICODE_MAX_ROOMS:-100}
      MULTICODE_ROOMS_PER_IP: ${MULTICODE_ROOMS_PER_IP:-5}
      MULTICODE_DATABASE_URL: postgresql://${MULTICODE_POSTGRES_USER:?set MULTICODE_POSTGRES_USER}:${MULTICODE_POSTGRES_PASSWORD:?set MULTICODE_POSTGRES_PASSWORD}@postgres:5432/${MULTICODE_POSTGRES_DB:-multicode}
      TZ: ${TZ:-America/New_York}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  multicode-postgres:
